<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d">
  <title id="t">Flujo de ramas: feature, pull request y fusión en main</title>
  <desc id="d">Diagrama animado: la rama main avanza con commits; de ella salen dos ramas de feature (feat/contacto y fix/fuentes) que vuelven a main mediante pull request.</desc>
  <style>
    .m{font:500 13px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;fill:#fff}
    .g{fill:#8a8a94}
    .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
    .main{stroke:#fff;animation-delay:.1s}
    .b1{stroke:#e10000;animation-delay:.9s}.b1r{stroke:#e10000;animation-delay:1.9s}
    .b2{stroke:#8a8a94;animation-delay:1.6s}.b2r{stroke:#8a8a94;animation-delay:2.6s}
    @keyframes draw{to{stroke-dashoffset:0}}
    .n{opacity:0;animation:pop .4s ease-out forwards}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
    .n{transform-box:fill-box;transform-origin:center}
    @media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.n{animation:none;opacity:1}}
  </style>
  <rect width="720" height="260" rx="10" fill="#0b0b0d"/>
  <!-- main -->
  <path class="ln main" pathLength="1" d="M40 190 H680"/>
  <!-- feat/contacto -->
  <path class="ln b1" pathLength="1" d="M140 190 C170 190 170 100 210 100 H330"/>
  <path class="ln b1r" pathLength="1" d="M330 100 C370 100 370 190 410 190"/>
  <!-- fix/fuentes -->
  <path class="ln b2" pathLength="1" d="M330 190 C360 190 360 45 400 45 H500"/>
  <path class="ln b2r" pathLength="1" d="M500 45 C540 45 540 190 580 190"/>
  <!-- commits -->
  <g fill="#fff"><circle class="n" style="animation-delay:.3s" cx="40" cy="190" r="7"/><circle class="n" style="animation-delay:.6s" cx="140" cy="190" r="7"/>
  <circle class="n" style="animation-delay:2.9s" cx="410" cy="190" r="7"/><circle class="n" style="animation-delay:3.3s" cx="580" cy="190" r="7"/><circle class="n" style="animation-delay:3.5s" cx="680" cy="190" r="7"/></g>
  <circle class="n" style="animation-delay:1.3s" cx="210" cy="100" r="7" fill="#e10000"/><circle class="n" style="animation-delay:1.6s" cx="330" cy="100" r="7" fill="#e10000"/>
  <circle class="n" style="animation-delay:2.2s" cx="330" cy="190" r="7" fill="#fff"/>
  <circle class="n" style="animation-delay:2.1s" cx="400" cy="45" r="7" fill="#8a8a94"/><circle class="n" style="animation-delay:2.4s" cx="500" cy="45" r="7" fill="#8a8a94"/>
  <!-- etiquetas -->
  <text class="m" x="40" y="222">main</text>
  <text class="m" x="212" y="80" fill="#e10000" style="fill:#e10000">feat/contacto</text>
  <text class="m g" x="402" y="28">fix/fuentes</text>
  <text class="m" x="372" y="215">PR + merge</text>
  <text class="m g" x="545" y="215">PR + merge</text>
  <text class="m g" x="40" y="246" style="font-size:12px">un commit = un cambio con su porqué</text>
</svg>
